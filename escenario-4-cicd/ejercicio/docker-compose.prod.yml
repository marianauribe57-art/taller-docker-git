services:
  app:
    image: marianamumm/app-cicd-sena:latest
    container_name: cicd_app_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "1.0.0"
      ENTORNO: production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s