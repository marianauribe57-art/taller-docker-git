services:
  app:
    build:
      context: .
      target: production
    container_name: cicd_app_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "1.0.0"
      ENTORNO: development
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s