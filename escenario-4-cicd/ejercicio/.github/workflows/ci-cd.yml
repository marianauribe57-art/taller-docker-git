name: CI/CD - Escenario 4

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: app-cicd-sena
  CONTEXTO: ./escenario-4-cicd/ejercicio

jobs:
  # ---------- 1. Tests ----------
  test:
    name: Ejecutar tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r escenario-4-cicd/ejercicio/src/requirements.txt
          pip install pytest==8.0.0 httpx==0.27.2

      - name: Ejecutar pruebas
        working-directory: escenario-4-cicd/ejercicio/src
        run: python -m pytest tests/ -v

  # ---------- 2. Escaneo de vulnerabilidades ----------
  seguridad:
    name: Escaneo con Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Escanear dependencias y configuracion
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './escenario-4-cicd/ejercicio'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

  # ---------- 3. Build y publicacion ----------
  build-push:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: [ test, seguridad ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata y tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXTO }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64