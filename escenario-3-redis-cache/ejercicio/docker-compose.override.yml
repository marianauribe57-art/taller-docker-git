services:
  app:
    build: ./app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app
    environment:
      ENTORNO: desarrollo

  db:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"

  # Interfaz web para inspeccionar Redis, solo en desarrollo
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cache_redis_ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - red_cache
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081"]
      interval: 30s
      timeout: 5s
      retries: 3